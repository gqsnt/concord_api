[package]
name = "concord_extras"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
json = ["dep:mime", "dep:serde", "dep:serde_json"]
csv = ["concord_core/records", "dep:csv", "dep:mime", "dep:serde"]
ndjson = ["concord_core/records", "dep:mime", "dep:serde", "dep:serde_json"]

[dependencies]
concord_core = { version = "=0.1.0", path = "../concord_core", default-features = false }
csv = { workspace = true, optional = true }
mime = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
