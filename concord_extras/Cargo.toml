[package]
name = "concord-extras"
description = "First-party implementations of Concord semantic extension contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
json = ["dep:mime", "dep:serde", "dep:serde_json"]
csv = ["concord_core/records", "dep:csv", "dep:mime", "dep:serde"]
ndjson = ["concord_core/records", "dep:mime", "dep:serde", "dep:serde_json"]
rate-limit-governor = ["dep:http", "dep:httpdate", "dep:tokio"]
oauth2-client = ["dep:bytes", "dep:http", "dep:serde_json", "dep:url"]

[dependencies]
bytes = { workspace = true, optional = true }
concord_core = { package = "concord-core", version = "=0.1.0", path = "../concord_core", default-features = false }
csv = { workspace = true, optional = true }
http = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
mime = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["test-util"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
