[workspace]
members = [
    "crates/concord",
    "crates/concord-core",
    "crates/concord-extras",
    "crates/concord-macros",
    "crates/concord-test-support",
    "crates/concord-examples",
    "tools/xtask",
    "tools/perf",
]
default-members = [
    "crates/concord",
    "crates/concord-core",
    "crates/concord-extras",
    "crates/concord-macros",
    "crates/concord-examples",
]
exclude = ["fixtures"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
cargo_metadata = "0.20.0"
csv = "1.3.1"
futures-core = "0.3.32"
h2 = "0.4.15"
http = "1.4.0"
http-body = "1.1.0"
httpdate = "1.0.3"
mime = "0.3.17"
proc-macro2 = "1.0.106"
pulldown-cmark = "0.13.0"
quote = "1.0.46"
reqwest = { version = "0.13.4", default-features = false }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", default-features = false, features = ["std"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
syn = { version = "2.0.119", features = ["full"] }
tokio = { version = "1.52.4", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml_edit = "0.22.24"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
