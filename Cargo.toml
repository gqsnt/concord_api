[workspace]
members = ["crates/concord", "crates/concord-core", "crates/concord-extras", "crates/concord-pagination", "crates/concord-macros", "examples/shapes", "examples/renamed", "examples/native", "examples/multipart", "examples/quickstart", "examples/riot", "examples/compat", "examples/fixture", "examples/sdk", "examples/app", "examples/extension", "examples/testserver", "examples/github-sdk", "examples/github-app", "examples/stripe-sdk", "examples/stripe-app", "examples/shopify-sdk", "examples/shopify-app", "examples/salesforce-sdk", "examples/salesforce-app", "examples/kubernetes-sdk", "examples/kubernetes-app", "checks/heap", "checks/stream-stress", "checks/dx03-csv-runtime", "checks/dx03-fanout-sink", "checks/maintenance-github", "checks/maintenance-stripe", "checks/maintenance-shopify", "checks/maintenance-salesforce", "checks/maintenance-kubernetes", "checks/clone-compat", "checks/hygiene", "checks/hygiene/key-a", "checks/hygiene/key-b", "checks/clone-hygiene", "checks/clone-hygiene/a", "checks/clone-hygiene/b", "checks/clone-hygiene/c", "checks/clone-hygiene/d", "benches/baselines", "benches/criterion"]
resolver = "3"

[workspace.package]
version = "4.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gqsnt/concord_api"
publish = false

[workspace.dependencies]
bytes = "1.10"
csv = "1.4"
csv-core = "0.1.13"
futures-core = "0.3.31"
futures-util = { version = "0.3.31", default-features = false }
http-body = "1.0.1"
http = "1.5"
mime = "0.3.17"
percent-encoding = "2.3"
proc-macro2 = "1.0.95"
quote = "1.0.40"
reqwest = { version = "0.13.4", default-features = false }
serde = "1.0.219"
serde_json = "1.0.140"
serde_urlencoded = "0.7.1"
syn = { version = "3.0.3", default-features = false }
tokio = { version = "1.45", default-features = false }

trybuild = "1.0.105"
url = "2.5.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
