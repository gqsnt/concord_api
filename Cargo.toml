[workspace]
members = [
    "crates/concord",
    "crates/concord-core",
    "crates/concord-extras",
    "crates/concord-inspect",
    "crates/concord-macros",
    "crates/concord-test-support",
    "crates/concord-examples",
    "tools/xtask",
    "tools/perf",
    "tests/downstream/concord-downstream-api",
    "tests/downstream/concord-downstream-app",
]
default-members = [
    "crates/concord",
    "crates/concord-core",
    "crates/concord-extras",
    "crates/concord-macros",
    "crates/concord-examples",
    "tests/downstream/concord-downstream-api",
    "tests/downstream/concord-downstream-app",
]
exclude = ["fixtures"]
resolver = "3"

[workspace.package]
version = "3.0.0-beta.1"
edition = "2024"
rust-version = "1.86"

[workspace.dependencies]
base64 = "0.23.0"
bytes = "1.12.1"
cargo_metadata = "0.23"
csv = "1.4"
futures-core = "0.3.33"
h2 = "0.4.16"
http = "1.4"
http-body = "1.1.0"
httpdate = "1.0.3"
mime = "0.3.17"
proc-macro2 = "1.0.107"
quote = "1.0.47"
reqwest = { version = "0.13.4", default-features = false }
regex = "1.11"
rustls = { version = "0.23.46", default-features = false, features = [ "ring", "std", "tls12" ] }
serde = { version = "1.0", default-features = false, features = ["std"] }
serde_json = "1.0"
syn = "3.0.3"
tokio = { version = "1.53", default-features = false }
tower-http = { version = "0.6.11", default-features = false }
tower-service = "0.3.3"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
