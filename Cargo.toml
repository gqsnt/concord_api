[workspace]
members = ["crates/concord", "crates/concord-core", "crates/concord-codecs", "crates/concord-extras", "crates/concord-pagination", "crates/concord-retry", "crates/concord-auth", "crates/concord-macros", "examples/shapes", "examples/renamed", "examples/native", "examples/multipart", "examples/quickstart", "examples/riot", "examples/compat", "examples/fixture", "examples/sdk", "examples/app", "examples/extension", "examples/testserver", "examples/github-sdk", "examples/github-app", "examples/stripe-sdk", "examples/stripe-app", "examples/shopify-sdk", "examples/shopify-app", "examples/salesforce-sdk", "examples/salesforce-app", "examples/kubernetes-sdk", "examples/kubernetes-app", "examples/airtable-sdk", "examples/amazon-s3-sdk", "examples/clickhouse-sdk", "examples/distribution-registry-sdk", "examples/dropbox-sdk", "examples/frankfurter-sdk", "examples/gitlab-sdk", "examples/google-drive-sdk", "examples/linear-sdk", "examples/hubspot-crm-sdk", "examples/microsoft-graph-sdk", "examples/nager-holidays-sdk", "examples/notion-sdk", "examples/ntfy-sdk", "examples/postmark-sdk", "examples/open-meteo-sdk", "examples/openai-sdk", "examples/pokeapi-sdk", "examples/slack-sdk", "examples/snowflake-sdk", "examples/twilio-sdk", "examples/world-bank-sdk", "checks/heap", "checks/stream-stress", "checks/dx03-csv-runtime", "checks/dx03-fanout-sink", "checks/phase-a", "checks/core-concepts", "checks/maintenance-github", "checks/maintenance-stripe", "checks/maintenance-shopify", "checks/maintenance-salesforce", "checks/maintenance-kubernetes", "checks/clone-compat", "checks/hygiene", "checks/hygiene/key-a", "checks/hygiene/key-b", "checks/clone-hygiene", "checks/clone-hygiene/a", "checks/clone-hygiene/b", "checks/clone-hygiene/c", "checks/clone-hygiene/d", "benches/baselines", "benches/criterion", "examples/open-library-sdk", "examples/nasa-neows-sdk", "examples/usgs-earthquake-catalog-sdk", "examples/discord-rest-sdk", "examples/fred-sdk", "crates/concord-ratelimit", "examples/zendesk-support-sdk", "examples/mailgun-sdk", "examples/intercom-sdk", "examples/adyen-checkout-sdk", "examples/paypal-sdk", "examples/square-payments-sdk", "examples/quickbooks-online-sdk", "examples/xero-accounting-sdk", "examples/mediawiki-action-api-sdk"]
resolver = "3"

[workspace.package]
version = "4.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gqsnt/concord_api"
publish = false

[workspace.dependencies]
bytes = "1.10"
csv = "1.4"
csv-core = "0.1.13"
futures-core = "0.3.31"
futures-util = { version = "0.3.31", default-features = false }
http-body = "1.0.1"
http = "1.5"
mime = "0.3.17"
percent-encoding = "2.3"
proc-macro2 = "1.0.95"
quote = "1.0.40"
reqwest = { version = "0.13.4", default-features = false }
serde = "1.0.219"
serde_json = "1.0.140"
serde_urlencoded = "0.7.1"
syn = { version = "3.0.3", default-features = false }
tokio = { version = "1.45", default-features = false }

trybuild = "1.0.105"
url = "2.5.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
