[workspace]
members = ["crates/concord", "crates/concord-macros", "examples/shapes", "examples/renamed", "examples/native", "checks/heap", "benches/baselines", "benches/perf"]
resolver = "3"

[workspace.package]
version = "4.0.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gqsnt/concord_api"
publish = false

[workspace.dependencies]
bytes = "1.10"
percent-encoding = "2.3"
proc-macro2 = "1.0.95"
quote = "1.0.40"
reqwest = { version = "0.13.4", default-features = false }
serde = "1.0.219"
serde_json = "1.0.140"
syn = { version = "3.0.3", default-features = false }
tokio = { version = "1.45", default-features = false }

trybuild = "1.0.105"
url = "2.5.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
