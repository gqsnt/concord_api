[workspace]
members = [
    "concord_core",
    "concord_macros",
    "concord_test_support",
    "concord_examples",
    "perf",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
base64 = "=0.22.1"
bytes = "=1.12.1"
futures-core = "=0.3.32"
h2 = "=0.4.15"
http = "=1.4.0"
http-body = "=1.1.0"
httpdate = "=1.0.3"
mime = "=0.3.17"
proc-macro-crate = "=3.5.0"
proc-macro2 = "=1.0.106"
quote = "=1.0.46"
reqwest = { version = "=0.13.4", default-features = false }
rustls = { version = "=0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.228", default-features = false, features = ["std"] }
serde_json = "=1.0.150"
syn = { version = "=2.0.119", features = ["full"] }
tokio = { version = "=1.52.4", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
