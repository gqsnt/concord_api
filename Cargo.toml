[workspace]
members = [
    "concord_core",
    "concord_macros",
    "concord_test_support",
    "concord_examples",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
reqwest = { version = "=0.13.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
