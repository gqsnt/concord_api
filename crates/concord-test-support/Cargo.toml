[package]
name = "concord-test-support"
description = "Deterministic internal test infrastructure for Concord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["cargo-fixture", "deterministic", "loopback"]
cargo-fixture = ["dep:serde_json"]
deterministic = ["dep:bytes", "dep:http", "dep:tokio"]
loopback = ["dep:base64", "dep:rustls"]

[dependencies]
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
