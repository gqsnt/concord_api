[package]
name = "concord-test-support"
description = "Deterministic internal test infrastructure for Concord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["deterministic", "loopback"]
deterministic = ["dep:bytes", "dep:http", "dep:tokio"]
loopback = ["dep:base64", "dep:rustls"]

[dependencies]
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "deterministic"
path = "tests/deterministic.rs"
required-features = ["deterministic"]

[lints]
workspace = true
