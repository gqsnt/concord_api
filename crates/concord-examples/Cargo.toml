[package]
name = "concord-examples"
description = "Compile-checked product examples for Concord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["default-tls", "http2", "rate-limit", "json", "oauth2-client", "multipart"]
default-tls = ["concord/default-tls"]
http2 = ["concord/http2"]
rate-limit = ["concord/rate-limit"]
json = ["concord/json", "serde", "serde_json", "serde/derive"]
oauth2-client = ["concord/oauth2-client"]
multipart = ["concord/multipart"]
records = ["concord/records"]
csv = ["records", "concord/csv"]
ndjson = ["records", "concord/ndjson"]
tokio = ["dep:tokio"]
riot-live = ["json", "rate-limit", "default-tls", "http2", "tokio"]

[dependencies]
concord = { version = "=2.1.0", path = "../concord", default-features = false }
futures-core.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
concord-test-support = { path = "../concord-test-support", default-features = false, features = ["loopback"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }

[[example]]
name = "minimal"
path = "examples/minimal.rs"

[[example]]
name = "records"
path = "examples/records.rs"
required-features = ["csv", "ndjson"]

[[example]]
name = "riot"
path = "examples/riot.rs"
required-features = ["riot-live"]

[lints]
workspace = true
