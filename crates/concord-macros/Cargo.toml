[package]
name = "concord-macros"
description = "Procedural macro for Concord: the `api!` declaration compiler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
# Literal header names and values are checked with the native parser at expansion time; the
# generated code builds them with the downstream `http` again, which stays authoritative.
http.workspace = true
# Declared body media types are parsed by `mime` (no Concord grammar).
mime.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full", "parsing", "printing", "proc-macro", "clone-impls"] }

[dev-dependencies]
# Only for the D11 consistency test: the runtime parser that the declared-base checker must not
# contradict.
concord-core = { path = "../concord-core" }

[lints]
workspace = true
