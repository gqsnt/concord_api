[package]
name = "concord-ratelimit"
description = "Runtime-independent keyed admission and concurrency leases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
tokio = { workspace = true, features = ["time"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
concord = { path = "../concord", default-features = false, features = ["json"] }
concord-retry = { path = "../concord-retry" }
concord-auth = { path = "../concord-auth" }
concord-testserver = { package = "concord-example-testserver", path = "../../examples/testserver" }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
