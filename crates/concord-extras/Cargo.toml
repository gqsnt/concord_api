[package]
name = "concord-extras"
description = "Compatibility facade for Concord standard codecs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true

[features]
json = ["concord-codecs/json"]
form = ["concord-codecs/form"]
stream = ["concord-codecs/stream"]
csv = ["concord-codecs/csv"]
jsonl = ["concord-codecs/jsonl"]
multipart = ["concord-codecs/multipart"]
sse = ["concord-codecs/sse"]

[dependencies]
concord-codecs = { path = "../concord-codecs", version = "=4.2.0" }

[lints]
workspace = true
