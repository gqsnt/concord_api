[package]
name = "concord-retry"
description = "Bounded application attempts with explicit replay permission and injected time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
concord = ["dep:concord-core", "dep:reqwest"]
tokio = ["dep:tokio"]

[dependencies]
concord-core = { path = "../concord-core", version = "=4.2.0", optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }

[dev-dependencies]
concord = { path = "../concord", default-features = false }
concord-testserver = { package = "concord-example-testserver", path = "../../examples/testserver" }
futures-util = { workspace = true, features = ["alloc"] }
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "sync", "time"] }

[lints]
workspace = true
