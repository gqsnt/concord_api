[package]
name = "concord"
description = "Contract compiler and bounded managed HTTP runtime for typed Rust API clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["default-tls", "http2", "rate-limit"]
default-tls = ["concord_core/default-tls"]
http2 = ["concord_core/http2"]
rate-limit = ["concord_extras/rate-limit"]
json = ["concord_extras/json"]
oauth2-client = ["concord_extras/oauth2-client"]
records = ["concord_core/records"]
csv = ["records", "concord_extras/csv"]
ndjson = ["records", "concord_extras/ndjson"]
multipart = ["concord_core/multipart"]
gzip = ["concord_core/gzip"]
brotli = ["concord_core/brotli"]
deflate = ["concord_core/deflate"]

[dependencies]
concord_core = { package = "concord-core", version = "=3.0.0-beta.1", path = "../concord-core", default-features = false }
concord_extras = { package = "concord-extras", version = "=3.0.0-beta.1", path = "../concord-extras", default-features = false }
concord_macros = { package = "concord-macros", version = "=3.0.0-beta.1", path = "../concord-macros", default-features = false }

[dev-dependencies]
concord_inspect = { package = "concord-inspect", path = "../concord-inspect" }
concord_test_support = { package = "concord-test-support", path = "../concord-test-support", default-features = false, features = ["loopback"] }
futures-core.workspace = true
h2.workspace = true
http.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "test-util", "time"] }
trybuild = "1.0.118"

[[test]]
name = "ui"
path = "tests/ui.rs"
test = false

# The v3 end-to-end suites exercise JSON representations, the local limiter and
# (for execution) TLS; without those features they are skipped, not broken.
[[test]]
name = "v3_smoke"
path = "tests/v3_smoke.rs"
required-features = ["json"]

[[test]]
name = "v3_catalog"
path = "tests/v3_catalog.rs"
required-features = ["json", "rate-limit"]

[[test]]
name = "v3_grammar"
path = "tests/v3_grammar.rs"
required-features = ["json", "rate-limit"]

[[test]]
name = "v3_execution"
path = "tests/v3_execution.rs"
required-features = ["json", "rate-limit", "default-tls"]

[[test]]
name = "current_language"
path = "tests/current_language.rs"
required-features = ["json", "rate-limit"]

[lints]
workspace = true

[[test]]
name = "content_coding"
path = "tests/content_coding.rs"
required-features = ["ndjson", "default-tls", "gzip", "brotli", "deflate"]

[[test]]
name = "provider_compression"
path = "tests/provider_compression.rs"
required-features = ["default-tls", "oauth2-client", "gzip", "brotli", "deflate"]
