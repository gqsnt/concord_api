[package]
name = "concord"
description = "A small typed, declarative layer over reqwest for modeling HTTP APIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"
# The release artifact is the library. Tests, UI fixtures, generated oracles and the test CA
# (key material) stay in the repository, where `tests-gen/` regenerates the oracles.
include = ["/src/**/*.rs", "/Cargo.toml", "/LICENSE-APACHE", "/LICENSE-MIT"]

# docs.rs documents every format, `Form` (feature `form`) included.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["json", "reqwest-defaults"]
## The standard formats without serializer dependencies: `Text` and `Binary` (from `concord-extras`).
extras = ["dep:concord-extras"]
## `Json`, via serde/serde_json (implies `extras`).
json = ["extras", "concord-extras/json"]
## `Form` (`application/x-www-form-urlencoded`), via serde/serde_urlencoded (implies `extras`).
## Off by default, like reqwest's own `form` feature.
form = ["extras", "concord-extras/form"]
## Enables reqwest's own default features (TLS, HTTP/2, charset, system proxy).
## Disable it to choose reqwest features yourself in your own Cargo.toml.
reqwest-defaults = ["concord-core/reqwest-defaults"]

[dependencies]
# The facade, the runtime and the macro are released together: the macro's expansion uses the
# runtime's hidden support API, so the versions are pinned exactly.
concord-core = { path = "../concord-core", version = "=4.0.0-alpha.1" }
concord-extras = { path = "../concord-extras", version = "=4.0.0-alpha.1", optional = true }
concord-macros = { path = "../concord-macros", version = "=4.0.0-alpha.1" }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time", "sync"] }
trybuild.workspace = true
tokio-rustls = "0.26"
rustls-pki-types = { version = "1.9", features = ["std"] }

[lints]
workspace = true

[[test]]
name = "slice"
required-features = ["json"]

[[test]]
name = "bodies"
required-features = ["json"]

[[test]]
name = "error_inspection"
required-features = ["json"]

[[test]]
name = "formats"
required-features = ["json"]

[[test]]
name = "forms"
required-features = ["form"]

[[test]]
name = "tls"
required-features = ["reqwest-defaults"]

[[test]]
name = "d15_surfaces"
required-features = ["reqwest-defaults", "json"]

# Uses the standard `Text`/`Binary` formats.
[[test]]
name = "composition"
required-features = ["extras"]

[[test]]
name = "hygiene"
required-features = ["extras"]

[[test]]
name = "native_headers"
required-features = ["extras"]

[[test]]
name = "native_keys"
required-features = ["extras"]

[[test]]
name = "representations"
required-features = ["extras"]

[[test]]
name = "values"
required-features = ["extras"]

[[test]]
name = "metadata"
required-features = ["json"]

[[test]]
name = "accept"
required-features = ["json"]
