[package]
name = "concord"
description = "A small typed, declarative layer over reqwest for modeling HTTP APIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"
# The release artifact is the library. Tests, UI fixtures, generated oracles and the test CA
# (key material) stay in the repository, where `tests-gen/` regenerates the oracles.
include = ["/src/**/*.rs", "/Cargo.toml", "/LICENSE-APACHE", "/LICENSE-MIT"]

[features]
default = ["json", "reqwest-defaults"]
## The `json` format (`format json;`, `request json;`, `response json;`), via serde/serde_json.
json = ["dep:serde", "dep:serde_json"]
## The `form` format (`request form;`, `application/x-www-form-urlencoded`), via serde/serde_urlencoded.
## Off by default, like reqwest's own `form` feature.
form = ["dep:serde", "dep:serde_urlencoded"]
## Enables reqwest's own default features (TLS, HTTP/2, charset, system proxy).
## Disable it to choose reqwest features yourself in your own Cargo.toml.
reqwest-defaults = ["reqwest/default"]

[dependencies]
bytes.workspace = true
concord-macros = { path = "../concord-macros", version = "=4.0.0-alpha.1" }
percent-encoding.workspace = true
reqwest.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_urlencoded = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time", "sync"] }
trybuild.workspace = true
tokio-rustls = "0.26"
rustls-pki-types = { version = "1.9", features = ["std"] }

[lints]
workspace = true

[[test]]
name = "slice"
required-features = ["json"]

[[test]]
name = "bodies"
required-features = ["json"]

[[test]]
name = "formats"
required-features = ["json"]

[[test]]
name = "forms"
required-features = ["form"]

[[test]]
name = "tls"
required-features = ["reqwest-defaults"]

[[test]]
name = "d15_surfaces"
required-features = ["reqwest-defaults", "json"]
