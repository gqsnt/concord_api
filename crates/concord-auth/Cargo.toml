[package]
name = "concord-auth"
description = "Sensitive credentials and a scoped, cancellation-safe token cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
base64 = "0.23.1"
http.workspace = true
futures-util = { workspace = true, features = ["std", "async-await"] }

[dev-dependencies]
concord = { path = "../concord", default-features = false }
concord-retry = { path = "../concord-retry", features = ["concord"] }
concord-testserver = { package = "concord-example-testserver", path = "../../examples/testserver" }
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }

[lints]
workspace = true
