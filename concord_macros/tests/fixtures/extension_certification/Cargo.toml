[package]
name = "concord-fixture-extension-certification"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
default = ["runtime-default"]
runtime-default = [
    "runtime/default-tls",
    "runtime/http2",
    "runtime/rate-limit-governor",
]
json = ["runtime/json"]
multipart = ["runtime/multipart"]
records = ["runtime/records"]
csv = ["records", "runtime/csv"]
ndjson = ["records", "runtime/ndjson"]

[dependencies]
runtime = { package = "concord", path = "../../../../concord", default-features = false }

[dev-dependencies]
concord_test_support = { path = "../../../../concord_test_support" }
tokio = { version = "=1.52.4", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
