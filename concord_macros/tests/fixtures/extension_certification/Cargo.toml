[package]
name = "concord-fixture-extension-certification"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
default = ["runtime-default"]
runtime-default = [
    "concord_core/default-tls",
    "concord_core/http2",
    "concord_core/rate-limit-governor",
]
json = ["concord_core/json"]
multipart = ["concord_core/multipart"]
records = ["concord_core/records"]
csv = ["records", "concord_core/csv"]
ndjson = ["records", "concord_core/ndjson"]

[dependencies]
concord_core = { path = "../../../../concord_core", default-features = false }
concord_macros = { path = "../../.." }

[dev-dependencies]
concord_test_support = { path = "../../../../concord_test_support" }
tokio = { version = "=1.52.4", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
