[package]
name = "concord-downstream-app"
description = "Downstream acceptance package: a separate crate consuming a downstream-generated Concord client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
concord = { version = "=3.0.0-beta.1", path = "../../../crates/concord", default-features = false, features = ["default-tls", "json"] }
concord-downstream-api = { version = "3.0.0-beta.1", path = "../concord-downstream-api" }

[dev-dependencies]
concord-test-support = { path = "../../../crates/concord-test-support", default-features = false, features = ["loopback"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
