[package]
name = "real-apis"
edition.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
concord = { package = "concord-api", path = "../../concord-api", features = ["multipart", "limit", "gzip-body", "sign", "rotating"] }
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
# The guide's application-generated write key is a UUID v4.
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
md-5 = "0.10.6"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
multer = { version = "3.1", default-features = false }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
crc32fast = "1"
mime = "0.3"
httparse = "1"
quick-xml = { version = "0.39.2", features = ["serialize"] }
tokio = { workspace = true, features = ["test-util", "fs"] }
concord-testkit = { path = "../../concord-testkit" }
