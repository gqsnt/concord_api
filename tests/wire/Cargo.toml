[package]
name = "wire"
edition.workspace = true
version.workspace = true
publish = false
description = "Concord's generated clients and shipped values against a local axum server, over HTTP/1.1 and HTTP/2. Never published."

[lints]
workspace = true

[dev-dependencies]
concord = { package = "concord-api", path = "../../concord-api", features = ["limit", "multipart"] }
# The server: axum over hyper and h2, on 127.0.0.1, HTTP/1.1 and HTTP/2 without TLS.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio", "multipart"] }
# The compression layer that a real server puts in front of its routes. Already in the lock.
tower-http = { version = "0.6.11", default-features = false, features = ["compression-gzip"] }
# `test-util`: the paused clock, which the server and the client share.
tokio = { workspace = true, features = ["net", "sync", "test-util"] }
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures-core.workspace = true

[features]
# The gzip decoder of `concord::Http` (`concord-api/gzip`).
gzip = ["concord/gzip"]
