[package]
name = "conformance-gen"
edition.workspace = true
version.workspace = true
publish = false
description = "Concord contract conformance tests. Never published."

[dependencies]
tour-gen = { path = "../tour-gen" }

[dev-dependencies]
concord = { package = "concord-api", path = "../../concord-api", features = ["tower", "multipart"] }
concord-testkit = { path = "../../concord-testkit" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
http.workspace = true
bytes.workspace = true
futures-core.workspace = true
# `c6_misuse.rs` captures what is logged (see the same lines in `conformance`).
tracing = { version = "0.1", default-features = false, features = ["std"] }
log = "0.4"

# Make compressed response fixtures without allocating their expanded bodies.
flate2 = "1"

[features]
gzip = ["concord/gzip"]
deflate = ["concord/deflate"]
socks = ["concord/socks"]
