nextest-version = "0.9.115"

[test-groups]
cargo-processes = { max-threads = 2 }

[profile.default]
retries = 0
# Report ordinary tests after 60 seconds and terminate a genuinely stuck test
# after three periods. Cargo-spawning tests receive a longer override below.
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
inherits = "default"
retries = 0
fail-fast = false
global-timeout = "60m"
# Keep CI slow reporting explicit even though the termination policy is
# inherited from the default profile.
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = '''
binary(compile)
| binary(compression_features)
| binary(config_methods)
| binary(dependency_policy)
| binary(development)
| binary(public_rustdoc)
'''
test-group = "cargo-processes"
retries = 0
# These tests intentionally launch Cargo to inspect a separate manifest,
# feature/dependency graph, or rendered public Rustdoc artifact. Trybuild/UI
# tests and ordinary public-surface tests use the normal profile. Report these
# bounded Cargo processes after two minutes and terminate after ten minutes
# rather than constraining unrelated loopback tests.
slow-timeout = { period = "120s", terminate-after = 5 }
