name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every gate comes from scripts/verify.sh, the inventory local runs use too (scripts/check-ci.py
  # fails if this file lists its own cargo commands). The pinned toolchain is also the minimum
  # supported Rust, so there is no separate MSRV job.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # Dependency cache (compiled dependencies only; workspace crates are rebuilt every run), keyed
      # by OS, toolchain and Cargo.lock. Every branch saves its own: GitHub lets a run restore only
      # its own branch's caches and the default branch's, so PR and dz/* runs cannot reuse another
      # branch's cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The cache can restore the gate's own output directories (target/packaged/*) without their
      # ownership marker, and scripts/fresh-output.sh then refuses them; they are outputs, not cache.
      - name: drop restored gate outputs
        shell: bash
        run: rm -rf target/packaged
      # The same complete inventory on both platforms: the packages are checked and the benchmarks
      # compiled (timed runs are in bench.yml).
      - name: scripts/verify.sh
        shell: bash
        run: scripts/verify.sh --package --bench
      - name: logs of failed steps
        if: failure()
        shell: bash
        run: |
          for log in target/verify-*.log; do
            echo "::group::$log"; cat "$log"; echo "::endgroup::"
          done

  # Conditional `Clone` (D08) relies on rustc not checking global bounds under a binder
  # (rust-lang/rust#48214). Nightly is where a change shows first; it must not block merges.
  nightly-clone:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - name: scripts/verify.sh --nightly-only
        shell: bash
        run: scripts/verify.sh --nightly-only
