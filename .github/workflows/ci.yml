name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.97.1
  RUST_MSRV: 1.85.0
  MDBOOK_VERSION: 0.5.4

jobs:
  quality:
    name: Quality and policy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ runner.os }}-${{ env.RUST_STABLE }}-${{ hashFiles('**/Cargo.lock') }}-quality
      - run: cargo fmt --all -- --check
      - run: cargo metadata --format-version 1 --all-features --locked > /dev/null
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check --workspace --all-targets --no-default-features --locked
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo check -p concord --lib --no-default-features --features rate-limit --locked
      - run: cargo check -p concord --lib --no-default-features --features json --locked
      - run: cargo check -p concord --lib --no-default-features --features oauth2-client --locked
      - run: cargo check -p concord --lib --no-default-features --features multipart --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo run --locked -p concord-xtask -- policy --locked
      - name: Workflow syntax
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          version: 1.7.12

  test:
    name: Tests and examples
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ runner.os }}-${{ env.RUST_STABLE }}-${{ hashFiles('**/Cargo.lock') }}-test
      - run: cargo test --workspace --exclude concord-macros --lib --tests --examples --locked
      - run: cargo test --workspace --exclude concord-macros --lib --tests --examples --all-features --locked

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: Install mdBook
        run: cargo install mdbook --version "${MDBOOK_VERSION}" --locked
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ runner.os }}-${{ env.RUST_STABLE }}-${{ hashFiles('**/Cargo.lock') }}-docs
      - run: cargo run --locked -p concord-xtask -- docs --locked
      - run: mdbook build
      - run: cargo test --workspace --doc --all-features --locked
      - run: cargo rustdoc -p concord-core --no-default-features --locked -- -D warnings
      - run: cargo rustdoc -p concord-extras --no-default-features --locked -- -D warnings
      - run: cargo rustdoc -p concord --no-default-features --locked -- -D warnings
      - run: cargo rustdoc -p concord --features rate-limit --locked -- -D warnings
      - run: cargo rustdoc -p concord-extras --features rate-limit --locked -- -D warnings
      - run: cargo rustdoc -p concord --features csv --locked -- -D warnings
      - run: cargo rustdoc -p concord --features json --locked -- -D warnings
      - run: cargo rustdoc -p concord --all-features --locked -- -D warnings
      - run: cargo rustdoc -p concord-core --all-features --locked -- -D warnings
      - run: cargo rustdoc -p concord-extras --all-features --locked -- -D warnings

  ui:
    name: Stable compiler contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ runner.os }}-${{ env.RUST_STABLE }}-${{ hashFiles('**/Cargo.lock') }}-ui
      - run: cargo test -p concord-macros --lib --locked
      - run: cargo test -p concord --test ui --no-default-features --locked
      - run: cargo test -p concord --test ui --all-features --locked
      - run: cargo test -p concord-core --test ui --no-default-features --locked

  msrv:
    name: MSRV product libraries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_MSRV }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ runner.os }}-${{ env.RUST_MSRV }}-${{ hashFiles('**/Cargo.lock') }}-msrv
      - run: cargo check -p concord-core --lib --all-features --locked
      - run: cargo check -p concord-macros --lib --locked
      - run: cargo check -p concord-extras --lib --all-features --locked
      - run: cargo check -p concord --lib --all-features --locked
      - run: cargo check -p concord-core -p concord-macros -p concord-extras -p concord --lib --no-default-features --locked
      - run: cargo run --locked -p concord-xtask -- msrv-ui --locked

  fixtures_package:
    name: Fixtures, packages, and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ runner.os }}-${{ env.RUST_STABLE }}-${{ hashFiles('**/Cargo.lock') }}-package
      - run: cargo run --locked -p concord-xtask -- fixtures --locked
      - run: cargo run --locked -p concord-xtask -- package --locked
      - name: Dependency and license policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check

  platform:
    name: Platform smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ runner.os }}-${{ env.RUST_STABLE }}-${{ hashFiles('**/Cargo.lock') }}-platform
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: 'cargo test -p concord --test runtime --all-features --locked runtime::deterministic::'

  analyzer:
    name: Rust analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rust-analyzer
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ runner.os }}-${{ env.RUST_STABLE }}-${{ hashFiles('**/Cargo.lock') }}-analyzer
      - run: rust-analyzer analysis-stats . --run-all-ide-things
      - run: rust-analyzer diagnostics .
