name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --locked -p concord --no-default-features
      - run: cargo test --locked -p concord --no-default-features --features json
      - run: cargo test --locked -p concord --no-default-features --features reqwest-defaults
      - run: cargo doc --locked -p concord --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --locked -p concord --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --locked -p concord --no-deps --no-default-features --features json
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85 --profile minimal
      # UI (trybuild) expectations are pinned to the toolchain in rust-toolchain.toml.
      - run: >
          cargo +1.85 test --locked -p concord --lib
          --test slice --test values --test composition --test bodies --test representations
          --test sensitivity --test hygiene --test tls --test attributes --test display_errors
          --test native_limits --test d15_surfaces --test oracle_composition --test oracle_sensitivity
      - run: >
          cargo +1.85 test --locked -p concord-macros -p concord-example-shapes
          -p concord-example-renamed -p concord-example-native -p concord-example-quickstart
          -p concord-heap-check
