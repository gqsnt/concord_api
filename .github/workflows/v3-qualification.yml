name: V3 qualification evidence

on:
  push:
    branches: [concord-v3]
    paths:
      - .github/workflows/v3-qualification.yml
      - scripts/qualification/**
  workflow_dispatch:
    inputs:
      candidate:
        description: Full V3 candidate commit (empty selects this workflow commit)
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  RUSTUP_TOOLCHAIN: 1.97.1
  QUALIFICATION_SOURCE: ${{ inputs.candidate || github.sha }}
  COMPARISON_BEFORE: ae6006184f3dc903fdfe66c572098ac810e2c6c5
  HISTORICAL_REFERENCE: 3765907aa2e424997bfd8f2fcdcc95275e6142f5

defaults:
  run:
    shell: bash

jobs:
  implementation:
    name: Linux implementation with retained evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the evidence recorder and parsers
        run: python3 -m unittest discover -s scripts/qualification -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.86.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt,rust-src,rust-analyzer
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: just@1.46.0
      - name: Workflow syntax
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          version: 1.7.12
      - name: Prepare an exact source checkout and native receipts
        run: |
          [[ "$QUALIFICATION_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          git worktree add --detach "$RUNNER_TEMP/qualification-source" "$QUALIFICATION_SOURCE"
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi
          mkdir -p "$RUNNER_TEMP/qualification-evidence" "$RUNNER_TEMP/concord-native-tmp"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/qualification-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/concord-native-tmp" >> "$GITHUB_ENV"
      - name: Record installed tools and locked fetching
        run: |
          python3 scripts/qualification/evidence.py environment --source "$RUNNER_TEMP/qualification-source" --out "$RUNNER_TEMP/qualification-evidence"
          python3 scripts/qualification/evidence.py record --source "$RUNNER_TEMP/qualification-source" --out "$RUNNER_TEMP/qualification-evidence" --label fetch-workspace -- cargo fetch --locked
          python3 scripts/qualification/evidence.py record --source "$RUNNER_TEMP/qualification-source" --out "$RUNNER_TEMP/qualification-evidence" --label fetch-fixtures -- cargo fetch --locked --manifest-path fixtures/Cargo.toml
      - name: Complete maintained Linux implementation gate
        run: python3 scripts/qualification/evidence.py record --source "$RUNNER_TEMP/qualification-source" --out "$RUNNER_TEMP/qualification-evidence" --label linux-implementation -- just verify-implementation
      - name: Native analyzer
        if: success()
        run: python3 scripts/qualification/evidence.py record --source "$RUNNER_TEMP/qualification-source" --out "$RUNNER_TEMP/qualification-evidence" --label linux-analyzer -- just analyzer
      - name: Clean source lifecycle audit
        if: success()
        run: python3 scripts/qualification/evidence.py record --source "$RUNNER_TEMP/qualification-source" --out "$RUNNER_TEMP/qualification-evidence" --label release-audit -- just release-audit
      - name: Preserve generated documentation and archives
        if: always()
        run: python3 scripts/qualification/evidence.py collect --source "$RUNNER_TEMP/qualification-source" --out "$RUNNER_TEMP/qualification-evidence"
      - name: Upload source-bound Linux evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-linux-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  performance:
    name: Paired ${{ matrix.mode }} measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [runtime, scale]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify evidence integrity before measurements
        run: python3 -m unittest discover -s scripts/qualification -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rust-src
      - name: Build isolated probes, align dependencies, and measure sequentially
        env:
          MEASUREMENT_MODE: ${{ matrix.mode }}
        run: |
          python3 scripts/qualification/performance.py "$MEASUREMENT_MODE" \
            --driver "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/performance-work" \
            --out "$RUNNER_TEMP/performance-evidence" \
            --candidate "$QUALIFICATION_SOURCE" \
            --before "$COMPARISON_BEFORE" \
            --historical "$HISTORICAL_REFERENCE"
      - name: Upload performance inputs, failures, and observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/performance-evidence
            !${{ runner.temp }}/performance-evidence/binaries
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
