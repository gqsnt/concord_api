[package]
name = "concord-extras"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/concord-extras"
publish.workspace = true
description = "Concord's writers, bounded readers, pagers, credential renewal, shared limits and returned-URL checks. Depend on `concord-api` instead."
readme = "README.md"
keywords = ["http", "json", "pagination", "multipart", "client"]
categories = ["web-programming::http-client"]
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
autobenches = false # The opt-in tools/measure package owns the allocator harness.

# docs.rs builds the pages with every feature on, and `--cfg docsrs` marks each item with the feature it needs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
concord-core = { path = "../concord-core", version = "=5.0.0-rc.1", default-features = false }
serde.workspace = true
serde_json = { workspace = true, optional = true }
serde_path_to_error = { version = "0.1", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
tower-service = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
getrandom = { version = "0.3", optional = true }
futures-core.workspace = true
tokio = { version = "1", default-features = false, features = ["time"], optional = true }
http-body = { version = "1", optional = true }
# Request compression is independent of response decompression in the core.
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }
time = { version = "0.3", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
bincode = "1.3.3"
concord-testkit = { path = "../concord-testkit" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# Rustdoc examples use the same facade and macro as applications.
concord = { package = "concord-api", path = "../concord-api", default-features = false, features = ["json", "form", "auth", "rotating", "sign", "limit", "multipart", "gzip-body"] }

[features]
default = ["json", "form"]
# Shared expiring credentials.
auth = ["dep:tokio", "dep:futures-util", "dep:http-body"]
# Single-use refresh tokens and an application-polled renewal future.
rotating = ["auth", "tokio/sync"]
# Request-signing helpers and Signature Version 4 middleware.
sign = ["dep:hmac", "dep:sha2", "dep:hex", "dep:time", "time/formatting", "dep:tokio"]
# Shared Retry-After gates, concurrency and keyed budgets.
limit = ["dep:tokio", "tokio/sync", "dep:http-body", "dep:time", "time/parsing"]
# JSON bodies and records, and their readers.
json = ["dep:serde_json", "dep:serde_path_to_error"]
# Flat and nested forms, and nested query pairs.
form = ["dep:serde_urlencoded"]
# A `tower` service as a transport: `concord_extras::tower::Tower`.
tower = ["dep:tower-service", "dep:futures-util"]

# RFC 7578 multipart body writer.
multipart = ["dep:futures-util", "dep:getrandom"]
# Buffered gzip request bodies; not response decompression.
gzip-body = ["dep:flate2"]
