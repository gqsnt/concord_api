[package]
name = "terra-review-task"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
concord = { path = "../../../crates/concord", features = ["json"] }
concord-pagination = { path = "../../../crates/concord-pagination" }
github = { package = "concord-example-github-sdk", path = "../../../examples/github-sdk" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
server = { package = "concord-example-testserver", path = "../../../examples/testserver" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
