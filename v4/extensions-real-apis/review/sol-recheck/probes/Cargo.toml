[package]
name = "sol-recheck-probes"
version = "0.0.0"
edition = "2024"

[workspace]

[features]
before = []

[dependencies]
concord = { path = "../../../crates/concord", features = ["json", "csv", "jsonl"] }
concord-extras = { path = "../../../crates/concord-extras", features = ["csv", "jsonl"] }
concord-extras-before = { path = "../baseline-extras", features = ["csv", "jsonl"] }
concord-core = { path = "../../../crates/concord-core" }
concord-pagination = { path = "../../../crates/concord-pagination" }
concord-example-github-sdk = { path = "../../../examples/github-sdk" }
concord-example-kubernetes-sdk = { path = "../../../examples/kubernetes-sdk" }
concord-example-salesforce-sdk = { path = "../../../examples/salesforce-sdk" }
concord-example-stripe-sdk = { path = "../../../examples/stripe-sdk" }
concord-example-shopify-sdk = { path = "../../../examples/shopify-sdk" }
concord-example-shopify-app = { path = "../../../examples/shopify-app" }
concord-example-testserver = { path = "../../../examples/testserver" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
http-body = "1.0.1"
csv = "1.4.0"

