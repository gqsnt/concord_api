[package]
name = "opus-review-task"
version = "0.0.0"
edition = "2024"
publish = false
description = "Review strand OPUS caller task: GH-A changed to incremental processing, durable item checkpoints and continue-after-child-failure."

[workspace]

[dependencies]
concord = { path = "../../../crates/concord", features = ["json", "stream", "jsonl"] }
concord-example-github-sdk = { path = "../../../examples/github-sdk" }
concord-pagination = { path = "../../../crates/concord-pagination" }

[dev-dependencies]
concord-example-shopify-app = { path = "../../../examples/shopify-app" }
concord-example-shopify-sdk = { path = "../../../examples/shopify-sdk" }
serde_json = "1.0.140"
bytes = "1.10"
concord-example-testserver = { path = "../../../examples/testserver" }
tokio = { version = "1.45", default-features = false, features = ["macros", "rt", "time", "sync"] }
