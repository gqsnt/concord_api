[package]
name = "astra-review-task"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
concord = { path = "../../../crates/concord", features = ["csv", "jsonl"] }
github = { package = "concord-example-github-sdk", path = "../../../examples/github-sdk" }
serde = { version = "1.0", features = ["derive"] }
futures-core = "0.3.31"
http-body = "1.0.1"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
