[package]
name = "design_a"
description = "A: native-conversion-first trait (`ToHeaderValue`), template/newtype formatting escape."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
http = "1.4"

[features]
# Negative coherence probes (each must FAIL to compile; see run.sh).
neg_display_blanket = []      # impl<T: Display> ToHeaderValue for T  +  impl for HeaderValue
neg_display_blanket_str = []  # impl<T: Display> ToHeaderValue for T  +  impl for str
neg_from_blanket = []         # impl<T> where HeaderValue: From<&T>    +  impl for str
# An opt-in marker trait for local `Display` types. Expected to FAIL next to the `&T`/`Box<T>`
# forwarding impls (E0119: downstream crates may implement the marker for `&_`/`Box<_>`).
neg_marker = []
