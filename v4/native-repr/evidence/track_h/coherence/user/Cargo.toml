[package]
name = "user"
description = "Downstream crate: renamed dependencies, aliases, qualified paths, foreign types; code shaped like `api!` output."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Renamed dependencies: the lab's "concord" and `http`/`reqwest` under other names.
concord4 = { package = "design_a", path = "../design_a" }
design_b = { path = "../design_b" }
design_c = { path = "../design_c" }
design_d = { path = "../design_d" }
hyperium = { package = "http", version = "1.4" }
rq = { package = "reqwest", version = "0.13", default-features = false }

[features]
neg_marker = ["concord4/neg_marker"]
# Negative probes (each must FAIL to compile; see run.sh).
neg_a_foreign_display = []
neg_a_option = []
neg_a_orphan = []
neg_a_float = []
neg_a_query = []
neg_a_literal_infer = []
neg_b_int_ref = []
neg_b_local_display = []
neg_b_orphan = []
neg_c_neither = []
neg_c_generic = []
neg_d_missing_keyword = []
neg_d_missing_keyword_plain = []
