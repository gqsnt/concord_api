[package]
name = "concord-testkit"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/concord-testkit"
publish.workspace = true
description = "For the tests of a Concord client: a scripted local HTTP/1.1 server, and a scripted transport with virtual time."
readme = "README.md"
keywords = ["http", "testing", "mock", "client"]
categories = ["development-tools::testing", "web-programming::http-client"]
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]

# docs.rs builds the pages with every feature on: `cargo doc --all-features`.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
concord-core = { path = "../concord-core", version = "=5.0.0-rc.1", default-features = false }
# `test-util`: the kit is for tests, and `Script` is meant for `start_paused = true`.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "sync", "test-util"] }
# The `Body` trait only, for the body of an answer of `Script`.
hyper = { version = "1", default-features = false }
bytes.workspace = true
http.workspace = true
