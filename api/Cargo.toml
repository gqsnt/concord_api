[workspace]
resolver = "2"
members = ["concord-core", "concord-macros", "concord-extras", "concord", "tour", "concord-testkit", "conformance", "tour-gen", "conformance-gen", "real-gen"]

[workspace.package]
edition = "2021"
version = "5.0.0-rc.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"

[workspace.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
http = "1"
futures-core = "0.3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
