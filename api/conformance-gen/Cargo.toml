[package]
name = "conformance-gen"
edition.workspace = true
version.workspace = true
publish = false
description = "The conformance suite of Concord: tests written from the paper (docs/contracts.md), before the engine exists. Never published."

[dependencies]
tour-gen = { path = "../tour-gen" }

[dev-dependencies]
concord = { path = "../concord", features = ["tower", "multipart"] }
concord-testkit = { path = "../concord-testkit" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
http.workspace = true
bytes.workspace = true
futures-core.workspace = true
# `c6_misuse.rs` captures what is logged (see the same lines in `conformance`).
tracing = { version = "0.1", default-features = false, features = ["std"] }
log = "0.4"
