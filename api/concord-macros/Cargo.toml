[package]
name = "concord-macros"
edition.workspace = true
version.workspace = true
rust-version = "1.96"
publish.workspace = true
description = "The macro `concord::api!`: it reads a nested description of an HTTP API and writes a typed client. Depend on `concord` instead."
readme = "README.md"
keywords = ["http", "client", "api", "rest", "macro"]
categories = ["web-programming::http-client"]
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]

# docs.rs builds the pages with every feature on: `cargo doc --all-features`.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
trybuild = "1"
# `multipart`: the page of the language shows a multipart body, and its doc test checks the bytes.
concord = { path = "../concord", features = ["multipart"] }
prettyplease = "0.2"
# The reference of the language (src/reference.md) is a page of doc tests: they run on Tokio
# and read into `serde` types.
tokio.workspace = true
serde.workspace = true
