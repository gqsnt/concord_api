[package]
name = "concord-extras"
edition.workspace = true
version.workspace = true
rust-version = "1.96"
publish.workspace = true
description = "What Concord ships beside its core: JSON, form and multipart writers, four readers, six pagers, Basic, a tower adapter. Depend on `concord` instead."
readme = "README.md"
keywords = ["http", "json", "pagination", "multipart", "client"]
categories = ["web-programming::http-client"]
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
autobenches = false # The opt-in tools/measure package owns the allocator harness.

# docs.rs builds the pages with every feature on: `cargo doc --all-features`.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
concord-core = { path = "../concord-core", version = "=5.0.0-rc.1", default-features = false }
serde.workspace = true
serde_json = { workspace = true, optional = true }
serde_path_to_error = { version = "0.1", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
tower-service = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
getrandom = { version = "0.3", optional = true }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
bincode = "1.3.3"
serde_json.workspace = true
tokio.workspace = true

[features]
default = ["json", "form"]
# `json(x)` and `Json`.
json = ["dep:serde_json", "dep:serde_path_to_error"]
# `form(x)`.
form = ["dep:serde_urlencoded"]
# A `tower` service as a transport: `concord_extras::tower::Tower`.
tower = ["dep:tower-service", "dep:futures-util"]

# RFC 7578 multipart body writer.
multipart = ["dep:futures-util", "dep:getrandom"]
