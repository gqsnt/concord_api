[package]
name = "concord-check-maintenance-salesforce"
description = "Staged maintenance exercise for the salesforce SDK: the frozen initial consumer and the updated consumer, both compiled against the current SDK."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord", features = ["csv"] }
concord-example-salesforce-sdk = { path = "../../examples/salesforce-sdk" }
concord-pagination = { path = "../../crates/concord-pagination" }

[dev-dependencies]
concord-example-testserver = { path = "../../examples/testserver" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
