[package]
name = "concord-hygiene-check"
description = "Native header keys written with the same tokens by two crates' macros (`$crate::KEY`): identity follows the resolved names, not the tokens."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord", default-features = false }
concord-hygiene-key-a = { path = "key-a" }
concord-hygiene-key-b = { path = "key-b" }

[lints]
workspace = true
