[package]
name = "concord-check-dx03-csv-runtime"
description = "A caller's runtime CSV exports client"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord", features = ["csv"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
concord-example-testserver = { path = "../../examples/testserver" }

[lints]
workspace = true
