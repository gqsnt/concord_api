[package]
name = "concord-clone-compat"
description = "Downstream compatibility checks for the conditional `Clone` of generated endpoint requests (decision D08), runnable on MSRV, current stable and nightly."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# No TLS or JSON: only `prepare()` is exercised, never I/O.
concord = { path = "../../crates/concord", default-features = false }

[lints]
workspace = true
