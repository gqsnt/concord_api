[package]
name = "consumer-phase-a-dx"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
concord = { path = "../../../crates/concord", default-features = false, features = ["csv", "jsonl"] }
concord-pagination = { path = "../../../crates/concord-pagination" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
futures-util = "0.3"
