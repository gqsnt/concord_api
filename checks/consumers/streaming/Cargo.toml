[package]
name = "consumer-streaming"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace: only the features named here reach concord, so a feature that the streaming
# formats forgot to declare (or that `csv` silently borrowed from `json`) fails here.
[workspace]

[dependencies]
concord = { path = "../../../crates/concord", default-features = false, features = ["csv", "jsonl"] }
concord-pagination = { path = "../../../crates/concord-pagination" }
serde = { version = "1", features = ["derive"] }
