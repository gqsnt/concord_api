[package]
name = "consumer-facade-gzip"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# A downstream application that enables reqwest's gzip support itself: Concord neither enables nor
# implements decompression (reqwest decompresses before Concord sees the body).
[dependencies]
concord = { path = "../../../crates/concord" }
reqwest = { version = "0.13.4", default-features = false, features = ["gzip"] }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.45", features = ["macros", "rt", "net", "io-util", "time", "sync"] }
