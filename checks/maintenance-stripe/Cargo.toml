[package]
name = "concord-check-maintenance-stripe"
description = "Staged maintenance exercise for the Stripe SDK slice: a frozen initial consumer (customer onboarding) and the updated consumer, both external callers compiled against the current SDK."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord", features = ["json"] }
concord-example-stripe-sdk = { path = "../../examples/stripe-sdk" }

[dev-dependencies]
concord-example-testserver = { path = "../../examples/testserver" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
