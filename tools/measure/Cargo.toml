[package]
name = "concord-measure"
version = "0.0.0"
edition = "2021"
publish = false

# A separate bench-only package: std::alloc::GlobalAlloc requires unsafe code.
# All library crates retain forbid(unsafe_code); no allocator dependency is used.
[workspace]

[dependencies]
concord = { package = "concord-api", path = "../../concord-api" }
criterion = { version = "0.8.2", default-features = false }
concord-core = { path = "../../concord-core" }
concord-extras = { path = "../../concord-extras" }
concord-testkit = { path = "../../concord-testkit" }
tour = { path = "../../tests/tour" }
tour-gen = { path = "../../tests/tour-gen" }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures-core = "0.3"
tokio = { version = "1", features = ["rt", "time", "test-util"] }

[[bench]]
name = "engine"
path = "../../concord-core/benches/engine.rs"
harness = false

[[bench]]
name = "readers"
path = "../../concord-extras/benches/readers.rs"
harness = false

[profile.bench]
debug = 1

[[bench]]
name = "macro_get"
path = "../../concord-api/benches/macro_get.rs"
harness = false
