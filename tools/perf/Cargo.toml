[package]
name = "concord-perf"
description = "Internal operation-exact performance probes for Concord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autobenches = false

[dependencies]
concord = { version = "=2.0.0", path = "../../crates/concord", default-features = false, features = ["default-tls", "records"] }
concord_test_support = { package = "concord-test-support", path = "../../crates/concord-test-support", default-features = false, features = ["loopback"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[bench]]
name = "concord_overhead"
harness = false

[lints]
workspace = true
