[package]
name = "concord-xtask"
description = "Portable repository validation tasks for Concord contributors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Registers the repository example clients as `contract` targets. Requires the
# examples to compile against the v3 macro.
examples = ["dep:concord_examples"]

[dependencies]
cargo_metadata.workspace = true
concord_core = { package = "concord-core", version = "=3.0.0-beta.1", path = "../../crates/concord-core", default-features = false, features = ["multipart"] }
concord_examples = { package = "concord-examples", path = "../../crates/concord-examples", optional = true }
concord_extras = { package = "concord-extras", version = "=3.0.0-beta.1", path = "../../crates/concord-extras", default-features = false, features = ["oauth2-client"] }
concord_inspect = { package = "concord-inspect", path = "../../crates/concord-inspect", features = ["fixtures"] }
proc-macro2 = { workspace = true, features = ["span-locations"] }
regex.workspace = true
serde_json.workspace = true
syn = { workspace = true, features = ["full", "parsing", "printing", "visit"] }

[lints]
workspace = true
