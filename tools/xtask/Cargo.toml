[package]
name = "concord-xtask"
description = "Portable repository validation tasks for Concord contributors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cargo_metadata.workspace = true
concord_core = { package = "concord-core", version = "=0.1.0", path = "../../crates/concord-core", default-features = false, features = ["multipart"] }
concord_extras = { package = "concord-extras", version = "=0.1.0", path = "../../crates/concord-extras", default-features = false, features = ["oauth2-client"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
toml_edit.workspace = true

[lints]
workspace = true
