[package]
name = "concord_examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["default-tls", "http2", "rate-limit-governor", "json", "oauth2-client", "multipart"]
default-tls = ["concord/default-tls"]
http2 = ["concord/http2"]
rate-limit-governor = ["concord/rate-limit-governor"]
json = ["concord/json", "serde", "serde_json", "serde/derive"]
oauth2-client = ["concord/oauth2-client"]
multipart = ["concord/multipart"]
records = ["concord/records"]
csv = ["records", "concord/csv"]
ndjson = ["records", "concord/ndjson"]
dangerous-raw-response = ["concord/dangerous-raw-response"]
dangerous-custom-retry = ["concord/dangerous-custom-retry", "dep:reqwest"]
tokio=["dep:tokio"]

[dependencies]
concord = { version = "=0.1.0", path = "../concord", default-features = false }
reqwest = { workspace = true, optional = true }
serde = {workspace=true, optional=true}
serde_json = {workspace=true, optional=true}
tokio = {workspace=true, optional=true}


[[example]]
name = "dangerous_raw_response"
required-features = ["dangerous-raw-response", "json"]

[[example]]
name = "dangerous_custom_retry"
required-features = ["dangerous-custom-retry"]

[[example]]
name = "body_workflows"
required-features = ["json", "multipart"]

[[example]]
name = "pagination"
required-features = ["json"]

[[example]]
name = "regional_api"
required-features = ["json"]


[[example]]
name = "riot"
required-features = ["json", "tokio"]

[[example]]
name = "records"
required-features = ["csv", "ndjson" ,"tokio"]

[lints]
workspace = true
