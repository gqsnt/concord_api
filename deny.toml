[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = [
    # BSD-licensed Brotli dependencies; keep each exception scoped to its crate.
    { allow = ["BSD-3-Clause"], crate = "alloc-no-stdlib" },
    { allow = ["BSD-3-Clause"], crate = "alloc-stdlib" },
    { allow = ["BSD-3-Clause", "MIT"], crate = "brotli" },
    { allow = ["Apache-2.0", "ISC"], crate = "ring" },
    { allow = ["ISC"], crate = "rustls-webpki" },
    { allow = ["BSD-3-Clause"], crate = "subtle" },
    { allow = ["ISC"], crate = "untrusted" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
