# Fuzz targets for the readers of response data, run with `cargo fuzz` (see README.md).
# This folder is its own workspace: the library's workspace and its checks never build it.
[package]
name = "concord-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
concord-core = { path = "../concord-core" }
concord-extras = { path = "../concord-extras", features = ["json", "limit"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "time"] }

[workspace]
members = ["."]

[[bin]]
name = "sse"
path = "fuzz_targets/sse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_lines"
path = "fuzz_targets/json_lines.rs"
test = false
doc = false
bench = false

[[bin]]
name = "link"
path = "fuzz_targets/link.rs"
test = false
doc = false
bench = false

[[bin]]
