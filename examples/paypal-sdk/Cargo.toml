[package]
name = "concord-sdk-paypal"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "A bounded PayPal REST slice (sandbox): client credentials, order create/show/authorize/capture, authorization capture/void and capture retrieval, tested offline"

[dependencies]
serde_plain.workspace = true
concord = { path = "../../crates/concord", features = ["form"] }
concord-auth = { path = "../../crates/concord-auth" }
concord-retry = { path = "../../crates/concord-retry", features = ["concord"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
concord-check-canary = { path = "../../checks/canary" }
concord-example-testserver = { path = "../testserver" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
