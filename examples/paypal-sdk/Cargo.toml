[package]
name = "concord-sdk-paypal"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "A bounded PayPal REST slice (sandbox): client-credentials tokens, Orders v2 create/show/capture and Payments v2 show capture, tested offline"

[dependencies]
concord = { path = "../../crates/concord", features = ["form"] }
concord-auth = { path = "../../crates/concord-auth" }
concord-retry = { path = "../../crates/concord-retry" }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
