[package]
name = "concord-sdk-cloudflare-zones"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "A bounded Cloudflare API v4 slice: list and fetch zones, list, fetch and create DNS records, tested offline"

[dependencies]
concord = { path = "../../crates/concord" }
concord-auth = { path = "../../crates/concord-auth" }
concord-pagination = { path = "../../crates/concord-pagination" }
concord-retry = { path = "../../crates/concord-retry", features = ["concord"] }
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
# `raw_value`: an envelope's `result` is kept unparsed until `success` is known, so a refused
# request whose `result` has an unexpected shape still surfaces Cloudflare's errors.
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
concord-check-canary = { path = "../../checks/canary" }
concord-example-testserver = { path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "test-util"] }

[lints]
workspace = true
