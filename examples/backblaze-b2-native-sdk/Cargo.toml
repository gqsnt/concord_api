[package]
name = "concord-sdk-backblaze-b2-native"
description = "A bounded Backblaze B2 Native API v4 SDK slice: authorize, upload with length and SHA-1, verified download, resumable file-name traversal and single-attempt version deletion with explicit uncertainty."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord", features = ["json"] }
# Shared Basic credential encoding (sensitive header value, colon/control refusals).
concord-auth = { path = "../../crates/concord-auth" }
# Bounded upload attempts with explicit replay permission; `tokio` for `run_tokio`'s sleep.
concord-retry = { path = "../../crates/concord-retry", features = ["tokio"] }
serde = { workspace = true, features = ["derive"] }
# Already in Cargo.lock: X-Bz-File-Name / X-Bz-Info-* percent-encoding.
percent-encoding.workspace = true
# Already in Cargo.lock: the `Stream` a one-shot upload source implements.
futures-core.workspace = true
# Already in Cargo.lock: the sized one-shot request body (`reqwest::Body::wrap`).
http-body.workspace = true
# Already in Cargo.lock: `Content-Type` syntax check of an upload's media type.
mime.workspace = true
# New: SHA-1 for X-Bz-Content-Sha1 and download verification (see PROVENANCE.md).
sha1_smol = "1.0.1"

[dev-dependencies]
concord-check-canary = { path = "../../checks/canary" }
concord-example-testserver = { path = "../testserver" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "test-util"] }

[lints]
workspace = true
