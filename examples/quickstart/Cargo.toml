[package]
name = "concord-example-quickstart"
description = "Downstream example: the quick start of docs/QUICKSTART.md, runnable offline against a local stand-in server; its tests also compile the guides' code."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_plain.workspace = true
concord = { path = "../../crates/concord" }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
# Only for the local stand-in server (`src/local_server.rs`), which reads and writes JSON itself.
serde_json.workspace = true

[lints]
workspace = true
