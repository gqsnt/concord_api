[package]
name = "concord-sdk-arxiv"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Bounded, fixture-tested arXiv Atom metadata SDK"

[dependencies]
concord = { path = "../../crates/concord", default-features = false, features = ["reqwest-defaults"] }
concord-codecs = { path = "../../crates/concord-codecs" }
concord-pagination = { path = "../../crates/concord-pagination" }
concord-ratelimit = { path = "../../crates/concord-ratelimit", features = ["tokio"] }
roxmltree = "=0.21.2"

[dev-dependencies]
concord-check-canary = { path = "../../checks/canary" }
concord-testserver = { package = "concord-example-testserver", path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
