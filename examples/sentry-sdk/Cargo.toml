[package]
name = "concord-sdk-sentry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Bounded, fixture-tested Sentry issue and event reads over Concord"

[dependencies]
concord = { path = "../../crates/concord", default-features = false, features = ["json", "reqwest-defaults"] }
concord-auth = { path = "../../crates/concord-auth" }
concord-pagination = { path = "../../crates/concord-pagination", features = ["link"] }
concord-retry = { path = "../../crates/concord-retry", features = ["concord"] }
concord-ratelimit = { path = "../../crates/concord-ratelimit", features = ["tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
concord-testserver = { package = "concord-example-testserver", path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "net"] }

[lints]
workspace = true
