[package]
name = "concord-sdk-xero-accounting"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Tenant-bound Xero invoice workflows with journaled OAuth rotation, tested offline"

[dependencies]
concord = { path = "../../crates/concord", features = ["form"] }
concord-auth = { path = "../../crates/concord-auth" }
concord-pagination = { path = "../../crates/concord-pagination" }
concord-retry = { path = "../../crates/concord-retry" }
concord-ratelimit = { path = "../../crates/concord-ratelimit", features = ["tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
concord-testserver = { package = "concord-example-testserver", path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
