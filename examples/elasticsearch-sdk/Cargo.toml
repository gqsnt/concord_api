[package]
name = "concord-sdk-elasticsearch"
description = "A bounded Elasticsearch SDK slice declared with concord::api!: NDJSON bulk requests whose per-item results are correlated with the submitted operations (partial failures are errors, only failed operations can be resubmitted), and point-in-time search_after traversal that always closes its PIT."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_plain.workspace = true
# `jsonl`: the shared `Ndjson` request format for the bulk body. The default `json` feature
# decodes every response and error document.
concord = { path = "../../crates/concord", features = ["jsonl"] }
# `authorization("ApiKey", key)`: the sensitive `Authorization` header value.
concord-auth = { path = "../../crates/concord-auth" }
# `Pages`: the bounded search_after chain (one dependent cursor per page).
concord-pagination = { path = "../../crates/concord-pagination" }
serde = { workspace = true, features = ["derive"] }
# `raw_value`: bulk lines, document sources and sort values are kept as the exact JSON text
# (no re-encoding of sort values, exact byte accounting of the bulk body).
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
concord-check-canary = { path = "../../checks/canary" }
concord-example-testserver = { path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
