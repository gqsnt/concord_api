[package]
name = "concord-example-extension"
description = "Downstream example: an independent crate adds a Catalog operation the SDK does not declare (a tenant's CSV export) through the SDK's public context boundary, with a provider profile of Concord's reusable CSV codec."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# `csv`: the reusable `concord::csv` codec (finite and incremental) that this crate profiles.
concord = { path = "../../crates/concord", features = ["csv"] }
concord-example-sdk = { path = "../sdk" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
concord-example-fixture = { path = "../fixture" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
