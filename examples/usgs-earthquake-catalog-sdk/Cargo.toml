[package]
name = "concord-sdk-usgs-earthquake-catalog"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Bounded USGS catalog queries, event lookup, and incremental CSV exports."

[dependencies]
concord = { path = "../../crates/concord", default-features = false, features = ["reqwest-defaults", "extras"] }
concord-codecs = { path = "../../crates/concord-codecs", default-features = false, features = ["json", "csv"] }
concord-pagination = { path = "../../crates/concord-pagination" }
concord-retry = { path = "../../crates/concord-retry" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
concord-check-canary = { path = "../../checks/canary" }
concord-testserver = { package = "concord-example-testserver", path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
