[package]
name = "concord-example-renamed"
description = "Downstream check: Concord used under a renamed dependency (e.g. next to V3)."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord4 = { package = "concord", path = "../../crates/concord", default-features = false }
# reqwest under another name too: its `HeaderValue` is the same type as `concord4::reqwest`'s.
reqwest013 = { package = "reqwest", version = "0.13.4", default-features = false }

[lints]
workspace = true
