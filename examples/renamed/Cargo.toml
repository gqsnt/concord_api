[package]
name = "concord-example-renamed"
description = "Downstream check: Concord used under a renamed dependency (e.g. next to V3)."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Defaults off, and exactly the feature this crate uses: `extras` (`Text`, `Binary`). Tested alone
# (`cargo test -p concord-example-renamed`), so another member cannot supply it.
concord4 = { package = "concord", path = "../../crates/concord", default-features = false, features = ["extras"] }
# reqwest under another name too: its `HeaderValue` is the same type as `concord4::reqwest`'s.
reqwest013 = { package = "reqwest", version = "0.13.4", default-features = false }

[lints]
workspace = true
