[package]
name = "concord-sdk-mediawiki-action-api"
description = "A bounded public-query slice of the MediaWiki Action API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
concord = { path = "../../crates/concord" }
concord-pagination = { path = "../../crates/concord-pagination" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
concord-testserver = { package = "concord-example-testserver", path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
