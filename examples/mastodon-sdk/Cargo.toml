[package]
name = "concord-sdk-mastodon"
description = "A bounded Mastodon SDK slice declared with concord::api!: read the public timeline, retrieve one status, discover the instance's streaming host and read the public timeline stream as Server-Sent Events."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# `json`: the timeline, status, instance and error documents; `sse`: Concord's server-sent events
# reader behind the public timeline stream.
concord = { path = "../../crates/concord", features = ["json", "sse"] }
# `bearer()`: the access token as a validated, sensitive `Authorization: Bearer` value.
concord-auth = { path = "../../crates/concord-auth" }
serde = { workspace = true, features = ["derive"] }
# The SSE `data` payloads (a Status) are parsed here: Concord's reader frames events, it does not
# decode them.
serde_json.workspace = true

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
