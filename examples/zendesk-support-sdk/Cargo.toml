[package]
name = "concord-sdk-zendesk-support"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "A bounded Zendesk Support (Ticketing API v2) slice: cursor-paginated ticket listing, show and idempotent create, tested offline"

[dependencies]
concord = { path = "../../crates/concord" }
concord-auth = { path = "../../crates/concord-auth" }
concord-codecs = { path = "../../crates/concord-codecs" }
concord-pagination = { path = "../../crates/concord-pagination" }
concord-retry = { path = "../../crates/concord-retry", features = ["concord"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
concord-check-canary = { path = "../../checks/canary" }
concord-example-testserver = { path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }

[lints]
workspace = true
