[package]
name = "concord-example-sdk"
description = "Downstream example: a small service SDK (Catalog and Ledger) declared with concord::api!, used by the application, extension and generated-input examples."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
concord-example-fixture = { path = "../fixture" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
