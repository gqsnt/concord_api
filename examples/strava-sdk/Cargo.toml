[package]
name = "concord-sdk-strava"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord", features = ["form"] }
concord-auth = { path = "../../crates/concord-auth" }
concord-pagination = { path = "../../crates/concord-pagination" }
concord-retry = { path = "../../crates/concord-retry", features = ["tokio"] }
concord-ratelimit = { path = "../../crates/concord-ratelimit", features = ["tokio"] }
reqwest = { workspace = true, features = ["multipart", "stream"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
futures-util = { workspace = true, features = ["std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
