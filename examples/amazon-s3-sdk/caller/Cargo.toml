[package]
name = "concord-j1-s3-caller"
description = "J1 spike: an application of the S3 SDK that opts into Concord's call event; the SDK's Cargo.toml and default features stay unchanged."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord-sdk-amazon-s3 = { path = ".." }
concord = { path = "../../../crates/concord", default-features = false, features = ["tracing"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
concord-check-canary = { path = "../../../checks/canary" }
concord-example-testserver = { path = "../../testserver" }
hmac = "0.13.0"
sha2 = "0.11.1"
httpdate = "1.0.3"  # used by the shared `tests/common` module

[lints]
workspace = true
