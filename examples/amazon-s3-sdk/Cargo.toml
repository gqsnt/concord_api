[package]
name = "concord-sdk-amazon-s3"
description = "A bounded Amazon S3 SDK slice (general-purpose buckets: ListObjectsV2, HeadObject, GetObject, single-request PutObject) declared with concord::api!, signed with AWS Signature Version 4, with XML documents, conditional and ranged reads, streamed object bodies and a continuation-token adapter for concord-pagination."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord", default-features = false, features = ["extras", "reqwest-defaults"] }
concord-pagination = { path = "../../crates/concord-pagination" }
aws-sigv4 = { version = "1.6.4", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1.3.1"
aws-smithy-runtime-api = { version = "1.19.2", default-features = false, features = ["client"] }
roxmltree = "0.21.2"
httpdate = "1.0.3"
percent-encoding.workspace = true

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
hmac = "0.13.0"
sha2 = "0.11.1"

[lints]
workspace = true
