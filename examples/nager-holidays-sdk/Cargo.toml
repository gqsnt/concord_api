[package]
name = "concord-sdk-nager-holidays"
description = "A finite Nager.Holidays Community v4 SDK slice built with Concord."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord", features = ["json"] }
serde = { workspace = true, features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
