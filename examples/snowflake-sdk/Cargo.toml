[package]
name = "concord-sdk-snowflake"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord" }
concord-pagination = { path = "../../crates/concord-pagination" }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync", "macros"] }

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
