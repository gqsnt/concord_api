[package]
name = "concord-sdk-europe-pmc"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_plain.workspace = true
concord = { path = "../../crates/concord" }
concord-codecs = { path = "../../crates/concord-codecs" }
concord-pagination = { path = "../../crates/concord-pagination" }
concord-retry = { path = "../../crates/concord-retry" }
roxmltree = "=0.21.2"
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
concord-check-canary = { path = "../../checks/canary" }
concord-testserver = { package = "concord-example-testserver", path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
