[package]
name = "concord-sdk-intercom"
version = "0.0.0"
description = "A bounded, fixture-tested Intercom contacts slice over Concord"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord" }
concord-auth = { path = "../../crates/concord-auth" }
concord-pagination = { path = "../../crates/concord-pagination" }
concord-retry = { path = "../../crates/concord-retry" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
