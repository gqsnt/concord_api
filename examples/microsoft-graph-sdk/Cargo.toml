[package]
name = "concord-sdk-microsoft-graph"
version = "0.0.0"
publish = false
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
concord = { path = "../../crates/concord" }
concord-pagination = { path = "../../crates/concord-pagination" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
futures-util = { workspace = true, features = ["std"] }

[lints]
workspace = true
