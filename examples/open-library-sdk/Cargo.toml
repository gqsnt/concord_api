[package]
name = "concord-sdk-open-library"
description = "A bounded, fixture-tested Open Library search and work retrieval SDK."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord", default-features = false, features = ["json", "reqwest-defaults"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
