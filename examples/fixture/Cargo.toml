serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }

[lints]
workspace = true
