[package]
name = "concord-sdk-square-payments"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Bounded Square Payments SDK, verified against local fixtures."

[dependencies]
concord = { path = "../../crates/concord", default-features = false, features = ["json", "reqwest-defaults"] }
concord-auth = { path = "../../crates/concord-auth" }
concord-pagination = { path = "../../crates/concord-pagination" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
