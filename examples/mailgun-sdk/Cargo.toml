[package]
name = "concord-sdk-mailgun"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "A bounded, fixture-tested Mailgun send and domain events SDK."

[dependencies]
serde_plain.workspace = true
concord = { path = "../../crates/concord", features = ["multipart"] }
concord-auth = { path = "../../crates/concord-auth" }
concord-pagination = { path = "../../crates/concord-pagination" }
concord-retry = { path = "../../crates/concord-retry" }
futures-util = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["multipart", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
mime.workspace = true

[dev-dependencies]
concord-check-canary = { path = "../../checks/canary" }
concord-example-testserver = { path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
