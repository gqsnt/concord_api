[package]
name = "concord-example-github-sdk"
description = "Provider SDK example (4.4 integrations): a bounded GitHub REST slice (repository, issues, pull requests, Actions runs/jobs/artifacts) declared with concord::api!, with Link-header pagination adapters and an artifact download that never forwards the token."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_plain.workspace = true
concord = { path = "../../crates/concord", features = ["json", "stream"] }
concord-pagination = { path = "../../crates/concord-pagination", features = ["link"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
concord-check-canary = { path = "../../checks/canary" }
concord-example-testserver = { path = "../testserver" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
