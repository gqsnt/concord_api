[package]
name = "concord-sdk-adyen-checkout"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Bounded, fixture-tested Adyen Checkout v71 sandbox slice"

[dependencies]
concord = { path = "../../crates/concord" }
concord-retry = { path = "../../crates/concord-retry", features = ["tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
