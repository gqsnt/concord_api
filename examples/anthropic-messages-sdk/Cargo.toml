[package]
name = "concord-sdk-anthropic-messages"
description = "A bounded Anthropic Messages SDK on Concord: token counting and non-streaming/streaming message creation, offline-tested."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# `sse` (implies `stream`) for Concord's `text/event-stream` reader; `json` is a default feature.
concord = { path = "../../crates/concord", features = ["sse"] }
# Only `http::retry_after` (no default features, no runtime): the strict `retry-after` parser.
concord-retry = { path = "../../crates/concord-retry" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
