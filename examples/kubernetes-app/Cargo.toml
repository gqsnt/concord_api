[package]
name = "concord-example-kubernetes-app"
description = "External caller of the Kubernetes SDK slice: KU-A workload inventory (chunked lists through concord-pagination) and KU-B list/watch/resync (consecutive JSON watch events), with loopback tests against the owned test server."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord", features = ["json", "jsonl"] }
concord-example-kubernetes-sdk = { path = "../kubernetes-sdk" }
concord-pagination = { path = "../../crates/concord-pagination" }

[dev-dependencies]
concord-example-testserver = { path = "../testserver" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
