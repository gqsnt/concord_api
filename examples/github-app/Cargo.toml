[package]
name = "concord-example-github-app"
description = "Provider caller example (4.4 integrations): the GitHub repository activity audit (GH-A) and workflow-artifact retrieval (GH-B) workflows over the public GitHub SDK slice and concord-pagination."
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
concord = { path = "../../crates/concord", features = ["tracing"] }
concord-example-github-sdk = { path = "../github-sdk" }
concord-pagination = { path = "../../crates/concord-pagination" }
# `log_one` prints Concord's call event (no regex filter: `fmt` only).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
# The binaries need a runtime (reqwest runs on Tokio); the library does not use Tokio.
tokio = { workspace = true, features = ["macros", "rt"] }

[dev-dependencies]
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
concord-check-canary = { path = "../../checks/canary" }
concord-example-testserver = { path = "../testserver" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
