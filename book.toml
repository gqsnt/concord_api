[book]
title = "Concord"
authors = ["Concord contributors"]
description = "Typed, managed HTTP API clients generated from explicit Rust contracts."
language = "en"
src = "docs"

[rust]
edition = "2024"

[build]
build-dir = "target/concord-docs"
create-missing = false
extra-watch-dirs = ["crates/concord-examples/src"]

[output.html]
additional-css = ["docs/theme/concord.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1

[output.html.redirect]
"/guide/01-represent-an-api.html" = "/start/first-api.html"
"/guide/02-understand-generated-rust.html" = "/guide/generated-rust.html"
"/guide/03-build-a-client-and-make-requests.html" = "/start/first-request.html"
