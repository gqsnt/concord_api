[package]
name = "concord-fixture-features"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
default = []
fixture-absence = []
default-tls = ["runtime/default-tls"]
http2 = ["runtime/http2"]
json = ["runtime/json"]
records = ["runtime/records"]
csv = ["runtime/csv"]
ndjson = ["runtime/ndjson"]
multipart = ["runtime/multipart"]
rate-limit-governor = ["runtime/rate-limit-governor"]
oauth2-client = ["runtime/oauth2-client"]
gzip = ["runtime/gzip"]
brotli = ["runtime/brotli"]
deflate = ["runtime/deflate"]
dangerous-raw-response = ["runtime/dangerous-raw-response"]
dangerous-custom-retry = ["runtime/dangerous-custom-retry"]
dangerous-dev-tools = ["runtime/dangerous-dev-tools"]

[dependencies]
runtime = { package = "concord", path = "../../concord", default-features = false }

[dev-dependencies]
concord-test-support = { package = "concord-test-support", path = "../../concord_test_support", default-features = false, features = ["loopback"] }
tokio = { version = "=1.52.4", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[[bin]]
name = "brotli_absent"
path = "src/bin/brotli_absent.rs"
required-features = ["fixture-absence"]
test = false

[[bin]]
name = "csv_absent"
path = "src/bin/csv_absent.rs"
required-features = ["fixture-absence"]
test = false

