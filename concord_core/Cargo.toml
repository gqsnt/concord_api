[package]
name = "concord_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["default-tls", "http2", "rate-limit-governor"]
default-tls = ["dep:rustls", "reqwest/rustls-no-provider"]
http2 = ["reqwest/http2"]
rate-limit-governor = []
json = ["dep:serde", "dep:serde_json"]
records = []
csv = ["records", "dep:csv", "dep:serde"]
ndjson = ["records", "dep:serde", "dep:serde_json"]
multipart = ["reqwest/multipart"]
gzip = ["reqwest/gzip"]
brotli = ["reqwest/brotli"]
deflate = ["reqwest/deflate"]
dangerous-raw-response = []
dangerous-custom-retry = []
dangerous-dev-tools = ["dep:concord_test_support"]

[dependencies]
bytes.workspace = true
concord_test_support = { version = "=0.1.0", path = "../concord_test_support", optional = true, default-features = false, features = ["deterministic"] }
csv = { workspace = true, optional = true }
futures-core.workspace = true
http.workspace = true
http-body.workspace = true
httpdate.workspace = true
mime.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustls = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
url.workspace = true

[dev-dependencies]
concord_macros = { version = "=0.1.0", path = "../concord_macros" }
concord_test_support = { version = "=0.1.0", path = "../concord_test_support" }
h2.workspace = true
http.workspace = true
http-body.workspace = true
reqwest = { workspace = true, features = ["http2", "rustls-no-provider", "system-proxy"] }
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["test-util"] }
trybuild = "=1.0.118"

[lints]
workspace = true
