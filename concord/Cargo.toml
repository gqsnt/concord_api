[package]
name = "concord"
description = "Contract compiler and bounded managed HTTP runtime for typed Rust API clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["default-tls", "http2", "rate-limit-governor"]
default-tls = ["concord_core/default-tls"]
http2 = ["concord_core/http2"]
rate-limit-governor = ["concord_extras/rate-limit-governor"]
json = ["concord_extras/json"]
oauth2-client = ["concord_extras/oauth2-client"]
records = ["concord_core/records"]
csv = ["records", "concord_extras/csv"]
ndjson = ["records", "concord_extras/ndjson"]
multipart = ["concord_core/multipart"]
gzip = ["concord_core/gzip"]
brotli = ["concord_core/brotli"]
deflate = ["concord_core/deflate"]
dangerous-raw-response = ["concord_core/dangerous-raw-response"]
dangerous-custom-retry = ["concord_core/dangerous-custom-retry"]
dangerous-dev-tools = ["concord_core/dangerous-dev-tools"]

[dependencies]
concord_core = { package = "concord-core", version = "=0.1.0", path = "../concord_core", default-features = false }
concord_extras = { package = "concord-extras", version = "=0.1.0", path = "../concord_extras", default-features = false }
concord_macros = { package = "concord-macros", version = "=0.1.0", path = "../concord_macros", default-features = false }

[dev-dependencies]
concord_test_support = { package = "concord-test-support", version = "=0.1.0", path = "../concord_test_support", default-features = false, features = ["cargo-fixture", "loopback"] }
futures-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true }
trybuild = "=1.0.118"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
